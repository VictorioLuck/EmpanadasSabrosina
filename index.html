<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu digital de Empanadas + Descuento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Outfit', sans-serif; color: #0f172a; }
        .glass-card { background: white; border-radius: 28px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .qty-input { width: 40px; text-align: center; font-weight: 800; font-size: 1.1rem; background: transparent; border: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .hidden { display: none; }
        .btn-promo {
            background: linear-gradient(45deg, #f59e0b, #ef4444);
            animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
    </style>
</head>
<body class="p-4 md:max-w-md mx-auto pb-10">

    <header class="text-center my-8">
        <span class="bg-orange-100 text-orange-600 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-widest">Producción Diaria</span>
        <h1 class="text-3xl font-black text-slate-900 mt-2 text-center">SOLO EMPANADAS <span class="text-orange-500">.</span></h1>
    </header>

    <div class="glass-card p-6 border border-slate-100 space-y-6">
        
        <section class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
            <div class="flex justify-between items-center mb-1">
                <label class="block text-[10px] font-bold text-blue-500 uppercase ml-1">Tasa de Cambio</label>
                <span id="status-tasa" class="text-[9px] font-bold text-blue-400 bg-white px-2 py-0.5 rounded-full shadow-sm">CONECTANDO...</span>
            </div>
            <div class="relative">
                <span class="absolute left-3 top-2 font-bold text-blue-300 text-lg">Bs.</span>
                <input type="number" id="tasa-bcv" value="0.00" step="0.01" oninput="calcularTotal()"
                    class="w-full bg-white border-2 border-blue-100 rounded-xl p-2 pl-12 outline-none focus:border-blue-400 text-xl font-black text-blue-700">
            </div>
        </section>

        <section>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">¿Quién ordena?</label>
            <input type="text" id="cliente" placeholder="Nombre o # de Mesa" 
                class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 outline-none focus:border-orange-400 focus:bg-white transition-all text-lg font-semibold">
        </section>

        <section id="seccion-promo">
            <button onclick="generarDescuento()" id="btn-descuento" class="btn-promo w-full text-white font-black py-4 rounded-2xl shadow-lg flex flex-col items-center justify-center transition-all active:scale-95">
                <span class="text-xs uppercase tracking-tighter opacity-90">¿Tienes suerte?</span>
                <span class="text-lg">🎁 OBTENER DESCUENTO</span>
            </button>
            <div id="badge-descuento" class="hidden mt-2 bg-green-100 border border-green-200 p-3 rounded-xl flex justify-between items-center">
                <span class="text-green-700 font-bold text-sm">🎉 ¡Cupón Aplicado!</span>
                <span id="valor-descuento-txt" class="bg-green-600 text-white px-3 py-1 rounded-lg font-black">-0%</span>
            </div>
        </section>

        <section>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-3 ml-1">Selecciona Cantidades</label>
            <div class="space-y-2" id="contenedor-sabores"></div>

            <div id="extra-combinada" class="mt-4 hidden">
                <label class="block text-[10px] font-bold text-orange-500 uppercase mb-1 ml-1">¿De qué son las combinadas?</label>
                <input type="text" id="detalle-combinada" placeholder="Ej: Carne/Queso, Pollo/Tajada" 
                    class="w-full bg-orange-50 border border-orange-200 rounded-xl p-3 outline-none text-sm font-medium focus:bg-white">
            </div>
        </section>

        <section class="bg-slate-900 p-5 rounded-3xl text-white shadow-xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-2 border-b border-slate-700 pb-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase">Resumen de Cuenta</span>
                <span id="total-uds-badge" class="bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-lg font-black">$0.00</span>
            </div>
            <div class="flex justify-between items-end">
                <div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Total en Bolívares</p>
                    <p class="text-2xl font-black text-white" id="total-bs-display">Bs. 0,00</p>
                    <p id="ahorro-txt" class="text-[10px] text-green-400 font-bold hidden"></p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Total Divisa</p>
                    <p class="text-xl font-bold text-orange-400" id="total-usd-display">$0.00</p>
                </div>
            </div>
        </section>

        <section class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-200">
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2 text-center">Datos de Pago Móvil</label>
            <div class="text-[11px] space-y-1 text-slate-600 font-semibold">
                <div class="flex justify-between"><span>Banco:</span> <span class="text-slate-900">Venezuela (0102)</span></div>
                <div class="flex justify-between"><span>Cédula:</span> <span class="text-slate-900">25.943.901</span></div>
                <div class="flex justify-between"><span>Teléfono:</span> <span class="text-slate-900">0412-082.50.20</span></div>
            </div>
        </section>

        <div class="space-y-3 pt-2">
            <button onclick="enviarWhatsApp()" class="w-full bg-[#128C7E] hover:bg-[#075E54] text-white font-bold py-5 rounded-2xl shadow-lg transition-all flex justify-center items-center gap-3 active:scale-95 group">
                <span class="uppercase tracking-widest text-sm">Enviar a Cocina</span>
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>

            <button onclick="limpiarOrden()" class="w-full py-3 text-slate-400 text-xs font-bold uppercase tracking-widest hover:text-red-500 transition-colors">
                ✕ Limpiar Orden
            </button>
        </div>
    </div>

    <script>
        const numeroWhatsapp = "584120825020";
        const PRECIO_SIMPLE = 1.8;
        const PRECIO_COMBINADA = 2.0;
        let descuentoAplicado = 0;

        const sabores = [
            { id: "s1", nombre: "Mechada", emoji: "🥩", tipo: "simple" },
            { id: "s2", nombre: "Pollo", emoji: "🍗", tipo: "simple" },
            { id: "s3", nombre: "Molida", emoji: "🥩", tipo: "simple" },
            { id: "s4", nombre: "Queso", emoji: "🧀", tipo: "simple" },
            { id: "s5", nombre: "Jamón", emoji: "🥓", tipo: "simple" },
            { id: "s6", nombre: "Asadura", emoji: "🔥", tipo: "simple" },
            { id: "s8", nombre: "Pescado", emoji: "🐟", tipo: "simple" },
            { id: "s7", nombre: "Combinada", emoji: "🔀", tipo: "combinada" }
        ];

        async function obtenerTasaBCV() {
            const statusLabel = document.getElementById('status-tasa');
            const inputTasa = document.getElementById('tasa-bcv');
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await response.json();
                if(data && data.promedio) {
                    inputTasa.value = data.promedio;
                    statusLabel.innerText = "ACTUALIZADO ✅";
                    statusLabel.classList.replace('text-blue-400', 'text-green-500');
                    calcularTotal();
                }
            } catch (error) {
                statusLabel.innerText = "MANUAL ⚠️";
                inputTasa.value = 40.00; 
                calcularTotal();
            }
        }

        window.onload = () => {
            renderizarSabores();
            obtenerTasaBCV();
        };

        function renderizarSabores() {
            const contenedor = document.getElementById('contenedor-sabores');
            sabores.forEach(sabor => {
                contenedor.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-100">
                        <div>
                            <span class="font-bold text-slate-700 ml-2">${sabor.emoji} ${sabor.nombre}</span>
                            <p class="text-[9px] text-slate-400 ml-8 font-bold">$${sabor.tipo === 'simple' ? PRECIO_SIMPLE.toFixed(2) : PRECIO_COMBINADA.toFixed(2)}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty('${sabor.id}', -1)" class="w-9 h-9 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold border border-slate-200 text-slate-400 hover:text-orange-500">-</button>
                            <input type="number" id="qty-${sabor.id}" value="0" class="qty-input" readonly>
                            <button onclick="updateQty('${sabor.id}', 1)" class="w-9 h-9 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold border border-slate-200 text-slate-400 hover:text-orange-500">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function generarDescuento() {
            const prob = Math.floor(Math.random() * 100) + 1;
            let porcentaje = 0;

            if (prob <= 95) {
                // 95% de probabilidad: Descuento del 2% al 6%
                porcentaje = Math.floor(Math.random() * (6 - 2 + 1)) + 2;
            } else {
                // 5% de probabilidad: Descuento del 7% al 12%
                porcentaje = Math.floor(Math.random() * (12 - 7 + 1)) + 9;
            }

            descuentoAplicado = porcentaje;
            
            // UI Update
            document.getElementById('btn-descuento').classList.add('hidden');
            document.getElementById('badge-descuento').classList.remove('hidden');
            document.getElementById('valor-descuento-txt').innerText = `-${porcentaje}%`;
            
            calcularTotal();
        }

        function updateQty(id, valor) {
            const input = document.getElementById(`qty-${id}`);
            let actual = parseInt(input.value);
            if (actual + valor >= 0) {
                input.value = actual + valor;
            }
            if (id === "s7") {
                const extra = document.getElementById('extra-combinada');
                parseInt(input.value) > 0 ? extra.classList.remove('hidden') : extra.classList.add('hidden');
            }
            calcularTotal();
        }

        function calcularTotal() {
            let subtotalUSD = 0;
            const tasa = parseFloat(document.getElementById('tasa-bcv').value) || 0;

            sabores.forEach(sabor => {
                const cant = parseInt(document.getElementById(`qty-${sabor.id}`).value);
                const precio = sabor.tipo === 'simple' ? PRECIO_SIMPLE : PRECIO_COMBINADA;
                subtotalUSD += cant * precio;
            });

            // Aplicar descuento
            const descuentoDolares = subtotalUSD * (descuentoAplicado / 100);
            const totalUSD = subtotalUSD - descuentoDolares;
            const totalBS = totalUSD * tasa;

            document.getElementById('total-usd-display').innerText = `$${totalUSD.toFixed(2)}`;
            document.getElementById('total-uds-badge').innerText = `$${totalUSD.toFixed(2)}`;
            document.getElementById('total-bs-display').innerText = `Bs. ${totalBS.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const ahorroTxt = document.getElementById('ahorro-txt');
            if(descuentoAplicado > 0 && subtotalUSD > 0) {
                ahorroTxt.innerText = `Ahorraste: $${descuentoDolares.toFixed(2)}`;
                ahorroTxt.classList.remove('hidden');
            } else {
                ahorroTxt.classList.add('hidden');
            }

            return { totalUSD, totalBS, tasa, subtotalUSD, descuentoDolares };
        }

        function limpiarOrden() {
            if(confirm("¿Borrar toda la orden?")) {
                document.getElementById('cliente').value = "";
                document.getElementById('detalle-combinada').value = "";
                document.getElementById('extra-combinada').classList.add('hidden');
                document.getElementById('btn-descuento').classList.remove('hidden');
                document.getElementById('badge-descuento').classList.add('hidden');
                descuentoAplicado = 0;
                sabores.forEach(sabor => document.getElementById(`qty-${sabor.id}`).value = 0);
                calcularTotal();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function enviarWhatsApp() {
            const { totalUSD, totalBS, tasa, subtotalUSD, descuentoDolares } = calcularTotal();
            const cliente = document.getElementById('cliente').value.trim();
            const detalleComb = document.getElementById('detalle-combinada').value.trim();
            
            if (!cliente) { alert("⚠️ Indica el nombre o mesa."); return; }
            if (totalUSD === 0) { alert("🥟 No hay empanadas seleccionadas."); return; }

            let detallePedido = "";
            let totalEmpanadas = 0;

            sabores.forEach(sabor => {
                const cant = parseInt(document.getElementById(`qty-${sabor.id}`).value);
                if (cant > 0) {
                    let precioUnit = sabor.tipo === 'simple' ? PRECIO_SIMPLE : PRECIO_COMBINADA;
                    let linea = `*${cant}* x ${sabor.emoji} *${sabor.nombre}* ($${precioUnit.toFixed(2)})`;
                    if (sabor.id === "s7") {
                        linea += `\n      └ _"${detalleComb || 'No especificado'}"_`;
                    }
                    detallePedido += linea + "\n";
                    totalEmpanadas += cant;
                }
            });

            let promoTxt = "";
            if(descuentoAplicado > 0) {
                promoTxt = `*🎁 DESCUENTO APLICADO:* ${descuentoAplicado}%\n*📉 AHORRO:* -$${descuentoDolares.toFixed(2)}\n*━━━━━━━━━━━━━━*\n`;
            }

            const mensajeTexto = 
`*╭─  🥟 NUEVA ORDEN  ─╮*

*👤 CLIENTE:* ${cliente.toUpperCase()}

*📝 DETALLE:*
${detallePedido}
*━━━━━━━━━━━━━━*
${promoTxt}*🔢 CANTIDAD:* *${totalEmpanadas}* unds.
*💵 TOTAL USD:* $${totalUSD.toFixed(2)}
*🇻🇪 TOTAL BS:* ${totalBS.toLocaleString('es-VE', {minimumFractionDigits: 2})}
_(@ ${tasa.toFixed(2)} BCV)_
*━━━━━━━━━━━━━━*

*💳 PAGO MÓVIL:*
• Banco: Venezuela (0102)
• CI: 25.943.901
• Telf: 04120825020

_🕒 Generado: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}_`;

            const url = `https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(mensajeTexto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
